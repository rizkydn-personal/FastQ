services:
  wal-archive-init:
    image: postgres:18
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 999:999 /wal-archive && chmod 0700 /wal-archive"]
    volumes:
      - pos-wal-archive:/wal-archive
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POS_ADMIN_PASSWORD: ${POS_ADMIN_PASSWORD:?Set POS_ADMIN_PASSWORD in .env}
      POS_APP_PASSWORD: ${POS_APP_PASSWORD:?Set POS_APP_PASSWORD in .env}
      POS_BACKUP_PASSWORD: ${POS_BACKUP_PASSWORD:?Set POS_BACKUP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      wal-archive-init:
        condition: service_completed_successfully
    volumes:
      - pos-postgres:/var/lib/postgresql
      - pos-wal-archive:/wal-archive
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/init-app-role.sh:/docker-entrypoint-initdb.d/002-app-role.sh:ro
      - ./db/init-backup-role.sh:/docker-entrypoint-initdb.d/003-backup-role.sh:ro
      - ./db/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300s
      - -c
      - archive_command=/bin/sh /usr/local/bin/archive-wal.sh %p %f
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_app -d pos"]
      interval: 10s
      timeout: 5s
      retries: 5
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos_backup
      POSTGRES_PASSWORD: ${POS_BACKUP_PASSWORD:?Set POS_BACKUP_PASSWORD in .env}
      PGPASSWORD: ${POS_BACKUP_PASSWORD:?Set POS_BACKUP_PASSWORD in .env}
      POS_BACKUP_DIR: /backups
    volumes:
      - ./db/backup-loop.sh:/backup-loop.sh:ro
      - pos-backups:/backups
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last-success && find /backups/.last-success -mmin -1560 -print -quit | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m
  pitr-backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos_backup
      POSTGRES_PASSWORD: ${POS_BACKUP_PASSWORD:?Set POS_BACKUP_PASSWORD in .env}
      PGPASSWORD: ${POS_BACKUP_PASSWORD:?Set POS_BACKUP_PASSWORD in .env}
      POS_BACKUP_DIR: /backups/pitr
      POS_WAL_ARCHIVE: /wal-archive
    volumes:
      - ./db/pitr-backup-loop.sh:/pitr-backup-loop.sh:ro
      - ./db/prepare-pitr-restore.sh:/prepare-pitr-restore.sh:ro
      - pos-backups:/backups
      - pos-wal-archive:/wal-archive
      - pos-restore:/restore-data
    entrypoint: ["/bin/sh", "/pitr-backup-loop.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/pitr/.last-success && find /backups/pitr/.last-success -mmin -1560 -print -quit | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m
  offsite-backup:
    image: restic/restic:0.19.1
    profiles: ["offsite"]
    hostname: fastq-pos
    restart: unless-stopped
    environment:
      RESTIC_REPOSITORY: ${POS_OFFSITE_RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${POS_OFFSITE_RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${POS_OFFSITE_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${POS_OFFSITE_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${POS_OFFSITE_S3_REGION:-us-east-1}
      POS_OFFSITE_S3_BUCKET_LOOKUP: ${POS_OFFSITE_S3_BUCKET_LOOKUP:-auto}
      RESTIC_CACHE_DIR: /tmp/restic-cache
    volumes:
      - ./db/offsite-backup-loop.sh:/offsite-backup-loop.sh:ro
      - pos-backups:/source/backups:ro
      - pos-wal-archive:/source/wal-archive:ro
      - pos-offsite-restore:/restore
    entrypoint: ["/bin/sh", "/offsite-backup-loop.sh"]
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/.last-success && find /tmp/.last-success -mmin -1560 -print -quit | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30m
  offsite-restore-import:
    image: postgres:18
    profiles: ["offsite-restore"]
    user: "0:0"
    restart: "no"
    volumes:
      - ./db/offsite-restore-import.sh:/offsite-restore-import.sh:ro
      - pos-offsite-restore:/restore:ro
      - pos-backups:/backups
      - pos-wal-archive:/wal-archive
    entrypoint: ["/bin/sh", "/offsite-restore-import.sh"]
  postgres-restore:
    image: postgres:18
    profiles: ["restore"]
    restart: "no"
    environment:
      PGDATA: /restore-data
      POSTGRES_DB: pos
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pos-restore:/restore-data
      - pos-wal-archive:/wal-archive:ro
    command: ["postgres"]
volumes:
  pos-postgres:
  pos-backups:
  pos-wal-archive:
  pos-restore:
  pos-offsite-restore:
